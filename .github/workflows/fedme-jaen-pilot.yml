name: Piloto FEDME Jaén
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar decodificador
        run: python -m pip install --quiet mapbox-vector-tile
      - name: Recopilar muestra limitada y deduplicar
        run: python scripts/collect-fedme-pilot.py --region jaen --zoom 9 --max-tiles 80 --delay 0.5
      - name: Guardar catálogo de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fedme-jaen-pilot
          path: data/fedme-jaen-pilot.json
          if-no-files-found: warn
